<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>批量文字取代工具</title>
    <style>
        /* 預設：淺色模式顏色變數 */
:root {
    --bg-color: #f5f5f5;        /* 網頁背景色 */
    --box-bg: #ffffff;          /* 文字框/區塊背景色 */
    --text-color: #333333;      /* 預設文字顏色 */
    --border-color: #cccccc;    /* 邊框顏色 */
    --btn-bg: #4a90e2;          /* 按鈕顏色 */
}

/* 觸發：深色模式顏色變數 */
[data-theme="dark"] {
    --bg-color: #121212;        /* 深色背景 */
    --box-bg: #1e1e1e;          /* 深色文字框 */
    --text-color: #e0e0e0;      /* 深色文字 (不要純白，眼睛才不痛) */
    --border-color: #444444;    /* 深色邊框 */
    --btn-bg: #357abd;          /* 深色按鈕 */
}

/* 將變數套用到你的網頁元素上 (並且加上漸變動畫) */
body {
    background-color: var(--bg-color);
    color: var(--text-color);
    transition: background-color 0.3s ease, color 0.3s ease; /* 切換時的柔和漸變 */
}

textarea, select, input {
    background-color: var(--box-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    transition: all 0.3s ease;
}

/* 🍎 蘋果風格的精緻切換開關 */
.theme-switch-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
}
.theme-switch {
    display: inline-block;
    height: 24px;
    position: relative;
    width: 44px;
}
.theme-switch input {
    display: none;
}
.slider {
    background-color: #ccc;
    bottom: 0;
    cursor: pointer;
    left: 0;
    position: absolute;
    right: 0;
    top: 0;
    transition: 0.3s;
    border-radius: 24px;
}
.slider:before {
    background-color: #fff;
    bottom: 4px;
    content: "";
    height: 16px;
    left: 4px;
    position: absolute;
    transition: 0.3s;
    width: 16px;
    border-radius: 50%;
}
input:checked + .slider { background-color: #4a90e2; }
input:checked + .slider:before { transform: translateX(20px); }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
            color: #212529;
            font-size: 16px;
        }

}

.flex-item {

}

        .progress-wrapper {
            display: none; align-items: center; margin-bottom: 10px;

        }
        progress { flex-grow: 1; height: 12px; border: none; border-radius: 6px; background-color: #e2e3e5; }
        progress::-webkit-progress-bar { background-color: #e2e3e5; border-radius: 6px; }
        progress::-webkit-progress-value { background-color: #28a745; border-radius: 6px; transition: width 0.1s linear; }
        progress::-moz-progress-bar { background-color: #28a745; border-radius: 6px; }
        
        .progress-text { margin-left: 15px; font-size: 0.95rem; font-weight: bold; color: #495057; min-width: 90px; text-align: right; }
        .report-toggle { margin-top: 15px; font-weight: 600; }
        #reportContainer { display: none; margin-top: 10px; }
        #reportTextarea { height: 250px; background-color: #f1f3f5; font-family: monospace; font-size: 0.9rem; color: #495057; }
        
        .engine-toggle {
            background-color: #e3f2fd; border: 1px solid #b3e5fc;
            padding: 10px 15px; border-radius: 8px; margin-bottom: 10px;
        }
        .engine-toggle label { color: #1565c0; font-weight: bold; cursor: pointer; }
        .preview-toggle-label { color: #d81b60 !important; margin-top: 8px; display: block;}

        /* --- 彈窗 (Modal) 與微調按鈕樣式 --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; width: 95%; max-width: 1000px; max-height: 90vh;
            border-radius: 12px; display: flex; flex-direction: column;
            padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .modal-header { margin-top: 0; margin-bottom: 15px; color: #343a40; display: flex; justify-content: space-between; align-items: center;}
        .modal-actions { display: flex; gap: 10px; margin-bottom: 10px; }
        .preview-list {
            overflow-y: auto; flex-grow: 1; border: 1px solid #ced4da;
            padding: 15px; border-radius: 6px; background: #f8f9fa;
        }
        .preview-item {
            display: flex; align-items: flex-start; margin-bottom: 15px;
            border-bottom: 1px dashed #dee2e6; padding-bottom: 12px;
        }
        .preview-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .preview-item input[type="checkbox"] { flex-shrink: 0; margin-top: 4px; margin-right: 15px; transform: scale(1.4); cursor: pointer; }
        .preview-content { flex-grow: 1; width: 100%; }
        .preview-badge { display: inline-block; background: #495057; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.85rem; }
        .preview-del { color: #dc3545; text-decoration: line-through; background: #ffe6e6; padding: 0 3px; border-radius: 3px;}
        .preview-add { color: #28a745; font-weight: bold; background: #e6ffe6; padding: 2px 6px; border-radius: 4px;}
        .modal-footer { display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px; }

        .btn-micro {
            padding: 4px 8px; font-size: 0.85rem; border: 1px solid #ced4da;
            background: #f8f9fa; border-radius: 4px; cursor: pointer; color: #495057; font-weight: bold;
        }
        .btn-micro:hover { background: #e2e6ea; border-color: #adb5bd; }
        .btn-micro:active { background: #dae0e5; }
        .btn-micro-line { color: #d81b60; border-color: #f5c6cb; background: #fdfdfe; }
        .btn-micro-line:hover { background: #f8d7da; border-color: #f5c6cb; }

        /* 下拉選單樣式 */
        .dropdown-container { margin-bottom: 12px; }
        .dropdown-container select {
            width: 100%; padding: 10px; border-radius: 6px; border: 2px solid #007bff;
            font-size: 1rem; font-weight: bold; color: #0056b3; cursor: pointer; background-color: #f8f9fa;
        }
        .dropdown-container select:hover { background-color: #e2e6ea; }
    </style>
</head>

function downloadFile(content, filename, mimeType) {
            // 🌟 1. 強制統一換行符號為 Windows 標準 (CR LF)
            const crlfContent = content.replace(/\r?\n/g, '\n').replace(/\n/g, '\r\n');
            
            // 🌟 2. 加上 UTF-8 BOM (\uFEFF) 魔法標記，確保 Windows 筆記本開啟絕對不亂碼
            const blob = new Blob(['\uFEFF' + crlfContent], {type: mimeType});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function parseWhitelist(str) {
            const whitelistSet = new Set();
            str.split('\n').forEach(line => { const t = line.trim(); if (t && !t.startsWith('#')) whitelistSet.add(t); });
            return { whitelistSet };
        }

        function parseRules(str) {
            const rules = [];
            str.split('\n').forEach(line => {
                const t = line.trim();
                if (t.startsWith('#') || !t) return;
                
                let i = -1;
                if (t.startsWith('REGEX:')) {
                    i = line.lastIndexOf('='); 
                } else {
                    i = line.indexOf('='); 
                }

                if (i === -1) rules.push({ key: line, value: "" });
                else {
                    let val = line.substring(i + 1).replace(/\\n/g, '\n').replace(/\\r/g, '\r').replace(/\\t/g, '\t');
                    rules.push({ key: line.substring(0, i), value: val });
                }
            });
            return { rules };
        }

        function escapeRegExp(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

        function buildAndApplyRules(rules, whitelistSet) {
            whitelistSet.forEach(w => rules.push({ key: w, value: w }));
            const literalRules = [];
            globalRegexRules = []; 
            rules.forEach(r => {
                if (r.key.startsWith('REGEX:')) {
                    try { globalRegexRules.push({ regex: new RegExp(r.key.substring(6), 'g'), value: r.value, originalKey: r.key }); } catch(e) {}
                } else literalRules.push(r);
            });
            literalRules.sort((a, b) => b.key.length - a.key.length);
            rulesMap = new Map(literalRules.map(r => [r.key, r.value]));
            const keys = Array.from(rulesMap.keys()).sort((a, b) => b.length - a.length);
            conversionRegex = keys.length > 0 ? new RegExp(keys.map(k => escapeRegExp(k)).join('|'), 'g') : null;
        }

        function splitTextIntoSafeChunks(text, targetChunkSize = 30000) {
            const chunks = []; let startIndex = 0;
            while (startIndex < text.length) {
                let expectedEnd = startIndex + targetChunkSize;
                if (expectedEnd >= text.length) { chunks.push(text.substring(startIndex)); break; }
                let nextNewline = text.indexOf('\n', expectedEnd);
                if (nextNewline === -1) { chunks.push(text.substring(startIndex)); break; } 
                else { chunks.push(text.substring(startIndex, nextNewline + 1)); startIndex = nextNewline + 1; }
            }
            return chunks;
        }

        function renderPreviewList() {
            elements.previewList.innerHTML = '';
            elements.previewCountText.textContent = `共找到 ${previewLogList.length} 處`;
            const frag = document.createDocumentFragment();
            
            previewLogList.forEach((data, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                
                const checkbox = document.createElement('input');

        }

function getPreviewItemHTML(index) {
            let item = previewLogList[index];
            let snippetStart = Math.max(0, item.currentStart - 15);
            let snippetEnd = Math.min(item.fullStr.length, item.currentEnd + 15);
            
            let snippetBefore = item.fullStr.substring(snippetStart, item.currentStart).replace(/\r?\n/g, ' ↵ ');
            let snippetAfter = item.fullStr.substring(item.currentEnd, snippetEnd).replace(/\r?\n/g, ' ↵ ');
            
            let matched = item.fullStr.substring(item.currentStart, item.currentEnd);
            let displayMatched = escapeHtml(matched).replace(/\n/g, '<span style="color:#adb5bd; font-size:0.8rem;">[換行]</span><br>');
            
            // 🌟 核心升級：加入文字輸入框與還原重做按鈕
            let undoDisabled = item.historyIndex <= 0 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : 'style="color:#d81b60;"';
            let redoDisabled = item.historyIndex >= item.history.length - 1 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : 'style="color:#007bff;"';
            
            return `
                <div style="margin-bottom: 6px;">
                    <span class="preview-badge">第 ${item.lineNumber} 行</span>

                <div style="color: #6c757d; font-size: 1.05rem; margin-bottom: 8px; line-height: 1.5; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #e9ecef;">
                    <span class="snip-before">${escapeHtml(snippetBefore)}</span><span class="preview-del snip-match" style="color:#dc3545; font-weight:bold; background:#ffe6e6;">${displayMatched}</span><span class="snip-after">${escapeHtml(snippetAfter)}</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; align-items:center; gap: 8px; font-size: 1rem;">
                        ➔ 替換為：
                        <input type="text" value="${escapeHtml(item.replacement)}" 
                               onchange="updateReplacement(${index}, this.value)" 
                               placeholder="(刪除)"
                               style="padding: 4px 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 0.95rem; width: 140px; font-family: inherit; background: ${item.replacement === '' ? '#ffe6e6' : '#e6ffe6'};">
                        <button type="button" class="btn-micro" onclick="undoItem(${index})" ${undoDisabled}>↩️ 還原</button>
                        <button type="button" class="btn-micro" onclick="redoItem(${index})" ${redoDisabled}>↪️ 重做</button>
                    </div>
                    <div style="display:flex; gap: 4px; align-items:center;">
                        <span style="font-size:0.85rem; color:#666; margin-right:4px;">邊界:</span>
                        <button type="button" class="btn-micro btn-micro-line" title="擴展至行首" onclick="adjustBound(${index}, 'left', 'line')">⇇行首</button>
                        <button type="button" class="btn-micro" onclick="adjustBound(${index}, 'left', -1)">←擴</button>
                        <button type="button" class="btn-micro" onclick="adjustBound(${index}, 'left', 1)">縮→</button>
                        <span style="color:#ccc; margin:0 2px;">|</span>
                        <button type="button" class="btn-micro" onclick="adjustBound(${index}, 'right', -1)">←縮</button>
                        <button type="button" class="btn-micro" onclick="adjustBound(${index}, 'right', 1)">擴→</button>
                        <button type="button" class="btn-micro btn-micro-line" title="擴展至行尾" onclick="adjustBound(${index}, 'right', 'line')">行尾⇉</button>
                    </div>
                </div>
            `;
        }

        // 🌟 新增：歷史紀錄引擎與按鈕功能
        window.saveItemState = function(index, start, end, rep) {
            let item = previewLogList[index];
            let curr = item.history[item.historyIndex];
            if (curr.start === start && curr.end === end && curr.rep === rep) return; 

            item.history = item.history.slice(0, item.historyIndex + 1); 
            item.history.push({ start, end, rep });
            item.historyIndex++;
            item.currentStart = start;
            item.currentEnd = end;
            item.replacement = rep;
        };

        window.updateReplacement = function(index, newVal) {
            saveItemState(index, previewLogList[index].currentStart, previewLogList[index].currentEnd, newVal);
            document.getElementById(`preview_content_${index}`).innerHTML = getPreviewItemHTML(index);
        };

        window.undoItem = function(index) {
            let item = previewLogList[index];
            if (item.historyIndex > 0) {
                item.historyIndex--;
                let state = item.history[item.historyIndex];
                item.currentStart = state.start;
                item.currentEnd = state.end;
                item.replacement = state.rep;
                document.getElementById(`preview_content_${index}`).innerHTML = getPreviewItemHTML(index);
            }
        };

        window.redoItem = function(index) {
            let item = previewLogList[index];
            if (item.historyIndex < item.history.length - 1) {
                item.historyIndex++;
                let state = item.history[item.historyIndex];
                item.currentStart = state.start;
                item.currentEnd = state.end;
                item.replacement = state.rep;
                document.getElementById(`preview_content_${index}`).innerHTML = getPreviewItemHTML(index);
            }
        };

        window.adjustBound = function(index, side, delta) {
            let item = previewLogList[index];
            let newStart = item.currentStart;
            let newEnd = item.currentEnd;

            if (side === 'left') {
                if (delta === 'line') {
                    let searchStart = newStart - 1;
                    if (searchStart >= 0 && item.fullStr[searchStart] === '\n') {
                        searchStart--;
                        if (searchStart >= 0 && item.fullStr[searchStart] === '\r') searchStart--;
                    }
                    let pos = item.fullStr.lastIndexOf('\n', searchStart);
                    newStart = pos === -1 ? 0 : pos + 1;
                } else {
                    newStart = Math.max(0, Math.min(newEnd - 1, newStart + delta));
                }
            } else {
                if (delta === 'line') {
                    let searchStart = newEnd;
                    if (searchStart < item.fullStr.length && item.fullStr[searchStart] === '\r') searchStart++;
                    if (searchStart < item.fullStr.length && item.fullStr[searchStart] === '\n') searchStart++;
                    
                    let pos = item.fullStr.indexOf('\n', searchStart);
                    if (pos === -1) {
                        pos = item.fullStr.length;
                    } else {
                        if (pos > 0 && item.fullStr[pos - 1] === '\r') pos--;
                    }
                    newEnd = Math.max(newStart + 1, Math.min(item.fullStr.length, pos));
                } else {
                    newEnd = Math.max(newStart + 1, Math.min(item.fullStr.length, newEnd + delta));
                }
            }
            
            // 🌟 使用記憶引擎來儲存新的邊界
            saveItemState(index, newStart, newEnd, item.replacement);
            document.getElementById(`preview_content_${index}`).innerHTML = getPreviewItemHTML(index);
        };

        function handleReplacement(matched, replacement, ruleName, mode, offset, fullString, chunkStartLine, currentChunkIndex, reportLog) {
            if (matched === replacement) return matched;

            if (mode === 'dry') {
                const stringBeforeMatch = fullString.substring(0, offset);
                const newlinesBefore = (stringBeforeMatch.match(/\r?\n/g) || []).length;
                
                previewLogList.push({
                    index: previewLogList.length,
                    chunkIndex: currentChunkIndex,
                    currentStart: offset,
                    currentEnd: offset + matched.length,
                    replacement: replacement,
                    ruleName: ruleName,
                    lineNumber: chunkStartLine + newlinesBefore,
                    fullStr: fullString,
                    // 🌟 寫入第一筆歷史記憶
                    history: [{ start: offset, end: offset + matched.length, rep: replacement }],
                    historyIndex: 0
                });
                return matched; 
            }
            
            if (mode === 'apply') {
                const displayMatched = matched.replace(/\r?\n/g, '\\n');
                const displayReplacement = replacement === '' ? '(刪除)' : replacement.replace(/\n/g, '\\n');
                const logKey = `[${ruleName}] ${displayMatched} ->${displayReplacement}`;
                
                if (reportLog) {
                    reportLog[logKey] = (reportLog[logKey] || 0) + 1;
                }
                return replacement;
            }
            
            return replacement;
        }

        function runConversion(sourceText, immediate = false, forcedMode = null) {
            clearTimeout(convertTimeout);
            const mode = forcedMode || (elements.previewToggleCheckbox.checked ? 'dry' : 'apply');
            if (immediate) processConversionAsync(sourceText, mode);
            else convertTimeout = setTimeout(() => processConversionAsync(sourceText, mode), 300);
        }

        function processConversionAsync(textToConvert, mode) {
            if (!textToConvert) {
                fullConvertedText = ""; elements.outputText.value = ""; updateReport({});
                elements.progressWrapper.style.display = 'none'; elements.previewModal.style.display = 'none';elements.nextStepBtn.style.display = 'none'; return;
            }
            
            const myConversionId = ++currentConversionId;
            elements.previewModal.style.display = 'none';
            elements.progressWrapper.style.display = 'flex';
            elements.progressText.textContent = mode === 'dry' ? '分析擷取中 0%' : '轉換中 0%';
            
            const chunks = splitTextIntoSafeChunks(textToConvert, 30000); 
            if (mode === 'dry') {
                previewLogList = [];
                globalChunks = [...chunks]; 
            }
            
            const totalChunks = chunks.length;
            let processedChunks = [];
            const reportLog = {};
            let currentChunkIndex = 0;
            let currentLineNumber = 1; 

            function processNextChunk() {
                if (myConversionId !== currentConversionId) return;

                let chunkStartLine = currentLineNumber;
                const originalChunk = chunks[currentChunkIndex]; 
                let chunk = chunks[currentChunkIndex];
